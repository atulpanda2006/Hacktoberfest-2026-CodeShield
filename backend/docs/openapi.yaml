    get:
      tags: [Trust]
      summary: Caller's trust network
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
  /trust/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: |
          For `GET` this is a **user id** (public trust network). For `PATCH` and
          `DELETE` it is a **trust relationship id**.
    get:
      tags: [Trust]
      summary: Public trust network
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Trust]
      summary: Update an endorsement (source developer or ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trustLevel: { type: integer, minimum: 1, maximum: 5 }
                trustReason: { type: [string, "null"] }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trust]
      summary: Remove an endorsement (source developer or ADMIN)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

